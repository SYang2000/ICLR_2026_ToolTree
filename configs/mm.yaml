# m&m benchmark configuration
# Closed-set: 33 APIs spanning vision, text, and arithmetic.

benchmark: "mm"

mcts:
  exploration_constant: 1.4
  max_rollouts: 60
  tau_pre: 0.3
  tau_post: 0.4
  early_stop_delta: 0.001
  early_stop_patience: 10
  max_depth: 10
  top_k: 5

planner_llm:
  model_name: "Qwen/Qwen2.5-32B-Instruct"
  base_url: "http://localhost:8000/v1"
  temperature: 0.0
  max_tokens: 1024

judge_llm:
  model_name: "Qwen/Qwen2.5-32B-Instruct"
  base_url: "http://localhost:8000/v1"
  temperature: 0.0
  max_tokens: 512

data_path: "data/mm/"
output_path: "outputs/mm/"
