  <circle cx="140" cy="630" r="13" fill="#059669"/>
  <path d="M134 630l4.5 4.5 8-9" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
