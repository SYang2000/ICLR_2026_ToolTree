  <text x="162" y="646" font-size="11.5" fill="#059669">trajectory reward R(τ*) = 0.91</text>

  <!-- ══ legend ══ -->
  <g font-size="12" fill="#475569">
    <path d="M560 626 h44" stroke="#C7D2FE" stroke-width="8" stroke-linecap="round"/>
